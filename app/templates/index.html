<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist Heatmap</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Watchlist Heatmap / Attention Numbers</h1>
      <p class="subtle">Paste a column of tickers, then run daily-close diagnostics.</p>
      <form method="post" action="/run" onsubmit="setLoading(this)">
        <label for="tickers_input">Tickers</label>
        <textarea id="tickers_input" name="tickers_input" rows="14" placeholder="Ticker&#10;GLD&#10;VAW&#10;IBIT">{{ raw_input }}</textarea>
        {% if token_required %}
        <label for="token">Access token</label>
        <input id="token" name="token" type="password" placeholder="Enter access token" value="{{ token or '' }}" />
        {% endif %}
        <div class="form-actions">
          <button id="runButton" type="submit">Run</button>
          <span id="loadingHint" class="subtle hidden">Loading prices and computing signals…</span>
        </div>
      </form>
      <section id="savedResults" class="hidden"></section>
    </main>
    <script>
      const LAST_RESULTS_KEY = 'watchlist:last-results-html';
      const LAST_INPUT_KEY = 'watchlist:last-input';

      function setLoading(form) {
        const btn = form.querySelector('#runButton');
        const hint = form.querySelector('#loadingHint');
        if (btn) btn.disabled = true;
        if (hint) hint.classList.remove('hidden');
      }

      function restoreLastRun() {
        const savedResults = localStorage.getItem(LAST_RESULTS_KEY);
        const savedInput = localStorage.getItem(LAST_INPUT_KEY);

        if (savedInput) {
          const textarea = document.getElementById('tickers_input');
          if (textarea) textarea.value = savedInput;
        }

        if (savedResults) {
          const container = document.getElementById('savedResults');
          if (container) {
            container.innerHTML = savedResults;
            container.classList.remove('hidden');
          }
        }
      }

      restoreLastRun();
    </script>
  </body>
</html>
